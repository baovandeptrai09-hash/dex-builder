name: Build DEX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Compile Java
      run: |
        mkdir -p build
        javac -source 8 -target 8 \
          -classpath $ANDROID_HOME/platforms/android-34/android.jar \
          -d build \
          SensHelper.java

    - name: Convert to DEX
      run: |
        $ANDROID_HOME/build-tools/34.0.0/d8 \
          --output . \
          build/com/senshelper/SensHelper.class

    - name: Verify
      run: |
        file classes.dex
        ls -la classes.dex

    - name: Upload DEX
      uses: actions/upload-artifact@v4
      with:
        name: classes-dex
        path: classes.dex
